<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website for second main</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #ddac9f;
      color: rgb(14, 1, 1);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
    }
    .card {
      background: #d9ec30;
      padding: 40px;
      border-radius: 16px;
      max-width: 400px;
    }
    h1 { color: #f97316; }
    .version {
      background: #f97316;
      padding: 6px 14px;
      border-radius: 20px;
      display: inline-block;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Website 🚀</h1>
    <p>Git → GitHub → Cloudflare[branch]</p>
    <p class="version">Version 3</p>
  </div>
</body>
</html>
